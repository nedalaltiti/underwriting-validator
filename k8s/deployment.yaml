apiVersion: apps/v1
kind: Deployment
metadata:
  name: underwriting-api
  labels:
    app: underwriting-api
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: underwriting-api
  template:
    metadata:
      labels:
        app: underwriting-api
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3978"
        prometheus.io/path: "/health"
    spec:
      serviceAccountName: underwriting-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: underwriting-api
        image: underwriting-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3978
          protocol: TCP
        env:
        # Application Configuration
        - name: APP_NAME
          value: "Underwriting Validation API"
        - name: DEBUG
          value: "false"
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "3978"
        
        # Database Configuration (from secrets)
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: host
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        - name: DB_PORT
          value: "5432"
        
        # Google Cloud Service Account Configuration (from secrets)
        - name: GOOGLE_SERVICE_ACCOUNT_TYPE
          valueFrom:
            secretKeyRef:
              name: google-credentials
              key: type
        - name: GOOGLE_SERVICE_ACCOUNT_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: google-credentials
              key: project-id
        - name: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY_ID
          valueFrom:
            secretKeyRef:
              name: google-credentials
              key: private-key-id
        - name: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: google-credentials
              key: private-key
        - name: GOOGLE_SERVICE_ACCOUNT_CLIENT_EMAIL
          valueFrom:
            secretKeyRef:
              name: google-credentials
              key: client-email
        - name: GOOGLE_SERVICE_ACCOUNT_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: google-credentials
              key: client-id
        - name: GOOGLE_SERVICE_ACCOUNT_AUTH_URI
          value: "https://accounts.google.com/o/oauth2/auth"
        - name: GOOGLE_SERVICE_ACCOUNT_TOKEN_URI
          value: "https://oauth2.googleapis.com/token"
        
        # Google Cloud Configuration
        - name: GOOGLE_CLOUD_PROJECT
          valueFrom:
            secretKeyRef:
              name: google-credentials
              key: project-id
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-central1"
        
        # Gemini Configuration
        - name: GEMINI_MODEL_NAME
          value: "gemini-2.0-flash-001"
        - name: GEMINI_TEMPERATURE
          value: "0.0"
        
        # Application Field Configuration (from secrets)
        - name: HARDSHIP_FINANCIAL_ID
          valueFrom:
            secretKeyRef:
              name: app-fields
              key: hardship-financial-id
        - name: HARDSHIP_DESCRIPTION_ID
          valueFrom:
            secretKeyRef:
              name: app-fields
              key: hardship-description-id
        - name: BUDGET_ACCTID
          valueFrom:
            secretKeyRef:
              name: app-fields
              key: budget-acctid
        - name: BUDGET_C_TYPE
          valueFrom:
            secretKeyRef:
              name: app-fields
              key: budget-c-type
        - name: BUDGET_ISCOAPP
          valueFrom:
            secretKeyRef:
              name: app-fields
              key: budget-iscoapp
        - name: BUDGET_LEADSTATUS
          valueFrom:
            secretKeyRef:
              name: app-fields
              key: budget-leadstatus
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 3978
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 3978
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Resource limits
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        
        # Volume mounts for temporary files
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-tmp
          mountPath: /var/tmp
      
      volumes:
      - name: tmp
        emptyDir: {}
      - name: var-tmp
        emptyDir: {}
      
      # Pod security and performance settings
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      
---
apiVersion: v1
kind: Service
metadata:
  name: underwriting-api-service
  labels:
    app: underwriting-api
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3978
    protocol: TCP
    name: http
  selector:
    app: underwriting-api

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: underwriting-api-sa
  annotations:
    # For EKS with IAM roles for service accounts
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT-ID:role/underwriting-api-role