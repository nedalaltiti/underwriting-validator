[tool.poetry]
name = "underwriting-validation"
version = "1.0.0"
description = "A pure API service for contact validation, providing hardship and budget analysis capabilities."
readme = "README.md"
packages = [{include = "underwriting_validation"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
pydantic = "^2.0.0"
httpx = "^0.25.0"
google-generativeai = "^0.3.0"
google-cloud-aiplatform = "^1.38.0"
python-dotenv = "^1.0.0"
backoff = "^2.2.0"
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
underwriting-api = "underwriting_validation.api.__main__:main"